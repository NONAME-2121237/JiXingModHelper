name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build release
        shell: pwsh
        run: ./build_exe.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JiXingModHelper
          path: dist/JiXingModHelper
          if-no-files-found: error

      - name: Package ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/JiXingModHelper -DestinationPath JiXingModHelper.zip -Force

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: JiXingModHelper.zip
          generate_release_notes: true
