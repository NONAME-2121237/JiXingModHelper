name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.x'

      - name: Build release
        shell: pwsh
        run: ./build_exe.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: JiXingModHelper-${{ github.sha }}
          path: dist/JiXingModHelper
          if-no-files-found: error

      - name: Package ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/JiXingModHelper -DestinationPath JiXingModHelper.zip -Force

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" JiXingModHelper.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes
